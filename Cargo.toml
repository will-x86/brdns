[package]
name = "brdns"
version = "0.1.0"
edition = "2024"



[lib]
path = "lib/mod.rs"

[[bin]]
name = "g"
path = "bin/g.rs"


[[bin]]
name = "s"
path = "bin/s.rs"

[[bin]]
name = "brdns-admin"
path = "bin/admin.rs"

[dependencies]
async-trait = "0.1.89"
config = { version = "0.15", features = ["toml"] }
base64 = "0.22.1"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus = "0.13"
once_cell = "1"
opentelemetry = "0.30"
opentelemetry_sdk = { version = "0.30", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.30", default-features = false, features = ["http-proto", "reqwest-client"] }
tracing-opentelemetry = "0.31"
openssl = "0.10.81"
clap = { version = "4.6.2", features = ["derive", "env"] }
reqwest = { version = "0.13.4", features = ["query", "json"]}
pingora = { version = "0.8.0", features = ["openssl", "lb"] }

rustls = "0.23.42"
tokio = { version = "1.53.0", features = ["full"] }
tokio-rustls = "0.26.4"
webpki-roots = "1.0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1.12.1"
pingora-proxy = "0.8.1"
http = "1.4.2"
axum = "0.8"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "migrate"] }
fuzztest = { path = "fuzztest/rust", optional = true }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }

[features]
fuzz = ["dep:fuzztest"]

[dev-dependencies]
googletest = "0.14.3"

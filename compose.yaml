# To override, create a `.env` file in same folder:
#
#   POSTGRES_USER=brdns
#   POSTGRES_PASSWORD=pass
#   POSTGRES_DB=brdns
#   POSTGRES_PORT=5432

services:
  postgres:
    image: postgres:18-alpine
    container_name: brdns-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brdns}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
      POSTGRES_DB: ${POSTGRES_DB:-brdns}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - brdns-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  prometheus:
    image: prom/prometheus:latest
    container_name: brdns-prom
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
    ports:
      - "127.0.0.1:9090:9090"   # Prometheus UI

  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: brdns-otel
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro,Z
    ports:
      - "127.0.0.1:4318:4318"   # brdns (host) pushes OTLP traces here
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: brdns-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686" # Jaeger UI

volumes:
  brdns-pg:

name: Test

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Refresh caches nightly at 8:00 AM UTC.
    - cron: '0 8 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@1fbea72663f6d4c03efaab13560c8a24cfd2a7cc  # v1.9.0
        with:
          toolchain: nightly

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: unit-test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: unit-test-${{ runner.os }}-

      - name: Run unit tests
        run: cargo test --lib --bins

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@1fbea72663f6d4c03efaab13560c8a24cfd2a7cc  # v1.9.0
        with:
          toolchain: nightly

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: integration-test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: integration-test-${{ runner.os }}-

      - name: Run integration tests
        run: cargo test --test integration -- --nocapture

  fuzz:
    name: Fuzz tests
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Disable core dumping and piping due to slowness
        run: |
          sudo sysctl -w kernel.core_pattern=""

      - name: Checkout repository with submodules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -yq \
            clang

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@1fbea72663f6d4c03efaab13560c8a24cfd2a7cc  # v1.9.0
        with:
          toolchain: nightly

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          bazelrc: |
            common --enable_platform_specific_config

      - name: Build Centipede static library and binary
        working-directory: fuzztest
        run: |
          bazel build -c opt //centipede:centipede_engine_static //centipede:centipede

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: fuzz-test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: fuzz-test-${{ runner.os }}-

      - name: Run fuzz tests
        env:
          FUZZTEST_LIB_PATH: ${{ github.workspace }}/fuzztest/bazel-bin/centipede
          FUZZTEST_CENTIPEDE_BINARY_PATH: ${{ github.workspace }}/fuzztest/bazel-bin/centipede/centipede
        run: |
          FUZZTEST_FUZZ_FOR=30s cargo test --test fuzz __fuzztest_mod__ -- --nocapture